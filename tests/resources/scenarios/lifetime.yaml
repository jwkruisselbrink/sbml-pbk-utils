id: lifetime
label: lifetime
model_instances:
  - id: simple
    label: simple
    model_path: tests/resources/models/simple/simple.annotated.sbml
    target_mappings:
      AGut: AGut
      ABlood: ABlood
      CBlood: '[ABlood]'
      CLiver: '[ALiver]'
      BWFixed: BW
      AgeRef: ~
      BWRef: ~
      Age: ~
      AgeInit: ~
  - id: lifetime
    label: lifetime
    model_path: tests/resources/models/simple_lifetime/simple_lifetime.annotated.sbml
    param_file: tests/resources/models/simple_lifetime/simple_lifetime.params.csv
    target_mappings:
      AGut: AGut
      ABlood: ABlood
      CBlood: '[ABlood]'
      CLiver: '[ALiver]'
      BWFixed: ~

scenarios:
  - id: oral_repeated
    label: Oral repeated dose
    time_unit: DAY
    amount_unit: MICROGRAMS
    duration: 10000
    evaluation_resolution: 1
    parameters:
        AgeInit: 2
        AgeRef: 10
        BWFixed: 40
        BWRef: 50
    dosing_events:
      - type: repeated_bolus
        target: AGut
        amount: 1
        adjustment: BW
        time: 0
        interval: 1
    outputs:
      - id: Age
        label: Age
        output: Age
      - id: BW
        label: Bodyweight
        output: BW
      - id: ABlood
        label: Amount in blood
        output: ABlood
      - id: CBlood
        label: Concentration in blood
        output: CBlood
      - id: ALiver
        label: Amount in liver
        output: ALiver
      - id: CLiver
        label: Concentration in liver
        output: CLiver
