id: distribution
label: distribution
model_instances:
  - id: simple
    label: simple
    model_path: tests/resources/models/simple/simple.annotated.sbml
    param_file: tests/resources/models/simple/simple.params.csv

scenarios:
  - id: oral_single
    label: Oral single dose with distribution parameters
    time_unit: DAY
    amount_unit: MICROGRAMS
    duration: 4
    evaluation_resolution: 24
    n_simulations: 10
    use_distributions: True
    parameters:
      BW:
        distribution: uniform
        min: 60
        max: 80
      CLUrine:
        distribution: lognormal
        mu: 0.0
        sigma: 0.2
    dosing_events:
      - type: single_bolus
        target: AGut
        amount: 1
        time: 1
    outputs:
      - id: ABlood
        label: Amount in blood
        output: ABlood
      - id: ALiver
        label: Amount in liver
        output: ALiver
